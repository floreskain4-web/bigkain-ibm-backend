name: Deploy BigKain Backend to IBM Code Engine
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Check IBM Cloud credentials
        id: creds
        run: |
          if [ -z "${{ secrets.IBMCLOUD_API_KEY }}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "IBMCLOUD_API_KEY secret not set - deploy steps will be skipped."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install IBM Cloud CLI
        if: steps.creds.outputs.available == 'true'
        run: |
          curl -fsSL https://clis.cloud.ibm.com/install/linux | sh
          ibmcloud plugin install code-engine -f
          ibmcloud plugin install container-registry -f

      - name: Authenticate with IBM Cloud
        if: steps.creds.outputs.available == 'true'
        run: |
          ibmcloud login --apikey "${{ secrets.IBMCLOUD_API_KEY  }}" -r "${{ secrets.IBM_REGION  || 'us-south' }}"
          ibmcloud cr login

      - name: Build and Push Container Image
        if: steps.creds.outputs.available == 'true'
        env:
          IMAGE_NAME: icr.io/bigkain/bigkain-backend
        run: |
          COMMIT_TAG="${IMAGE_NAME}:${{ github.sha }}"
          LATEST_TAG="${IMAGE_NAME}:latest"
          docker build --platform linux/amd64 -t "$COMMIT_TAG" -t "$LATEST_TAG" .
          docker push "$COMMIT_TAG"
          docker push "$LATEST_TAG"

      - name: Deploy Application to Code Engine
        if: steps.creds.outputs.available == 'true'
        run: |
          ibmcloud ce app update bigkain-backend \
            --image icr.io/bigkain/bigkain-backend:latest \
            --wait

      - name: Verify Code Engine health endpoint
        if: steps.creds.outputs.available == 'true'
        run: |
          APP_URL="$(ibmcloud ce app get --name bigkain-backend --output url)"
          APP_URL="${APP_URL%/}"
          test -n "$APP_URL"
          RESPONSE="$(curl --fail --silent --show-error \
            --retry 8 --retry-delay 5 --retry-connrefused --max-time 20 \
            "$APP_URL/health")"
          printf 'GET %s/health\n%s\n' "$APP_URL" "$RESPONSE"
          printf '%s' "$RESPONSE" | jq -e '.ok == true and .service == "bigkain-backend"'

      - name: Deploy skipped (no credentials)
        if: steps.creds.outputs.available != 'true'
        run: |
          echo "Skipped: set the IBMCLOUD_API_KEY repo secret to enable IBM Code Engine deploys."
